name: Rust check

on:
  push:
    branches: [main, 'rust/**']
    paths: ['app/rust/**', '.github/workflows/rust-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust build, imports and manifest
        shell: pwsh
        run: ./app/rust/scripts/check.ps1
